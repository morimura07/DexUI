    <script>
      // Resolve the theme before first paint so there is no flash of the wrong
      // one. Must stay in <head>, before the module script.
      (function () {
        try {
          var t = localStorage.getItem('ss_theme');
          if (t !== 'light' && t !== 'dark') {
            // The light palette is a placeholder; the app ships dark-only for now.
            t = 'dark';
          }
          document.documentElement.classList.toggle('dark', t === 'dark');
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
